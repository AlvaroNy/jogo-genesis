<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Gênesis</title>
<style>
  :root{
    --bg1:#0b1020; --bg2:#141a33; --panel:rgba(255,255,255,.06); --panel-b:rgba(255,255,255,.12);
    --txt:#eaf0ff; --muted:#9aa6cc; --gold:#f6c453;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    color:var(--txt); background:radial-gradient(1200px 800px at 50% -10%,#1c2547,#0b1020 60%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 30px; user-select:none; overflow-x:hidden;
  }
  .wrap{width:100%; max-width:520px; position:relative; z-index:1}

  .screen{display:none}
  .screen.active{display:block; animation:screenIn .38s ease}
  @keyframes screenIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px}
  .title{font-size:22px; font-weight:800; letter-spacing:.04em}
  .title small{display:block; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.18em; text-transform:uppercase}
  .topbtns{display:flex; gap:8px; align-items:center}
  .iconbtn, .medals-btn, .backbtn{
    background:var(--panel); border:1px solid var(--panel-b); color:var(--txt);
    border-radius:12px; cursor:pointer; font-weight:700; font-size:14px;
  }
  .medals-btn{padding:9px 14px}
  .medals-btn b{color:var(--gold)}
  .iconbtn{width:40px; height:40px; font-size:17px; display:flex; align-items:center; justify-content:center}
  .backbtn{padding:9px 14px; display:flex; align-items:center; gap:6px}
  .iconbtn:active,.medals-btn:active,.backbtn:active{transform:translateY(1px)}

  /* MENU */
  .menu{min-height:78vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; padding:10px 0}
  .brand{font-size:52px; font-weight:900; letter-spacing:.06em;
    background:linear-gradient(180deg,#fff,#a9b6e6); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 8px 40px rgba(120,140,255,.25)}
  .tagline{color:var(--muted); font-size:14px; letter-spacing:.06em; margin-bottom:8px}
  .menu-orb{width:150px; height:150px; margin:14px 0 26px; position:relative}
  .menu-orb .core{position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#5b6cff,#141a33 68%);
    box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 18px 60px rgba(80,100,255,.35), inset 0 -14px 34px rgba(0,0,0,.5), inset 0 12px 26px rgba(255,255,255,.15);
    overflow:hidden}
  .menu-orb .core::after{content:""; position:absolute; inset:-30%; border-radius:50%;
    background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.12),transparent 42%);
    animation:spin 12s linear infinite; mix-blend-mode:screen}
  .menu-orb .ico{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:66px; z-index:2;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)); animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(-4px)}50%{transform:translateY(6px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .orbit{position:absolute; inset:-14px; border-radius:50%; animation:spin 20s linear infinite}
  .orbit span{position:absolute; top:-4px; left:50%; transform:translateX(-50%); font-size:20px}
  .menu-btns{display:flex; flex-direction:column; gap:12px; width:100%; max-width:280px}
  .btn-primary{
    padding:16px; border-radius:16px; border:none; cursor:pointer; font-weight:800; font-size:19px;
    background:linear-gradient(180deg,#ffd76b,#f6b23c); color:#231a02;
    box-shadow:0 10px 26px rgba(246,178,60,.32); letter-spacing:.03em;
  }
  .btn-primary:active{transform:translateY(2px)}
  .menu-row{display:flex; gap:12px}
  .btn-sec{flex:1; padding:12px; border-radius:14px; cursor:pointer; font-weight:700; font-size:14px;
    background:var(--panel); border:1px solid var(--panel-b); color:var(--txt)}
  .btn-sec:active{transform:translateY(1px)}
  .btn-whats{
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:14px; border-radius:14px; border:none; cursor:pointer; font-weight:800; font-size:15px;
    background:linear-gradient(180deg,#2bd66f,#1faa56); color:#04270f;
    box-shadow:0 8px 22px rgba(37,211,102,.28);
  }
  .btn-whats svg{width:20px; height:20px; fill:#04270f}
  .btn-whats:active{transform:translateY(2px)}
  .menu-foot{margin-top:20px; font-size:12px; color:#6b7699}

  /* WORLD SELECT */
  .worlds-head{text-align:center; margin:4px 0 16px}
  .worlds-head h2{font-size:22px; font-weight:800}
  .worlds-head p{font-size:13px; color:var(--muted); margin-top:3px}
  .worlds-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
  .wtile{position:relative; border:1px solid var(--panel-b); border-radius:18px; padding:16px 12px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    text-align:center; cursor:pointer; transition:transform .12s ease, border-color .2s, box-shadow .2s; overflow:hidden}
  .wtile .num{position:absolute; top:8px; left:10px; font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.1em}
  .wtile .wemoji{font-size:44px; line-height:1; margin:6px 0 8px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
  .wtile .wname{font-size:14px; font-weight:800}
  .wtile .wtag{font-size:11px; color:var(--muted); margin-top:3px; min-height:14px}
  .wtile.playable{border-color:rgba(246,196,83,.35)}
  .wtile.playable:hover{transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,.35); border-color:var(--gold)}
  .wtile.playable .glow{position:absolute; left:50%; bottom:-40%; width:130%; height:80%; transform:translateX(-50%);
    border-radius:50%; background:var(--gold); opacity:.16; filter:blur(20px)}
  .wtile.locked{opacity:.62; cursor:not-allowed}
  .wtile.locked .wemoji{filter:grayscale(1) opacity(.6)}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  .wtile.shake{animation:shake .4s ease}
  .wtile .prog{position:absolute; top:8px; right:10px; font-size:11px; font-weight:800; color:var(--gold)}

  /* GAME */
  .scene{
    background:linear-gradient(180deg,var(--bg2),rgba(20,26,51,.4));
    border:1px solid var(--panel-b); border-radius:20px; padding:16px; text-align:center;
    position:relative; overflow:hidden;
  }
  #fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3}
  .scene .lvl{font-size:12px; color:var(--muted); letter-spacing:.15em; text-transform:uppercase; position:relative; z-index:4}

  .world-slot{position:relative; width:170px; height:170px; margin:10px auto 8px; z-index:2}
  .world{
    position:absolute; inset:10px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:74px;
    background:radial-gradient(circle at 35% 30%,#33406e,#0c1230 70%);
    box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 10px 40px rgba(0,0,0,.5), inset 0 -12px 30px rgba(0,0,0,.55), inset 0 10px 24px rgba(255,255,255,.12);
    transition:background .6s ease; overflow:hidden;
  }
  .world .shine{position:absolute; inset:-30%; border-radius:50%;
    background:conic-gradient(from 0deg, transparent, rgba(255,255,255,.10), transparent 40%);
    animation:spin 14s linear infinite; mix-blend-mode:screen}
  .world .emo{position:relative; z-index:2; filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
  .ring{position:absolute; inset:0; border-radius:50%; border:2px solid transparent; pointer-events:none}
  @keyframes ringPulse{0%{transform:scale(.85); opacity:.9} 100%{transform:scale(1.35); opacity:0}}
  .ring.go{animation:ringPulse .6s ease-out}
  @keyframes worldPop{0%{transform:scale(.9)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
  .world.bump{animation:worldPop .4s ease}

  .story{min-height:44px; font-size:15px; line-height:1.4; color:#dfe6ff; margin:6px 4px 4px; position:relative; z-index:4}
  @keyframes storyIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .story.in{animation:storyIn .35s ease}

  .stats{display:flex; gap:6px; justify-content:center; margin-top:10px; flex-wrap:wrap; position:relative; z-index:4}
  .stat{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); background:var(--panel); padding:4px 9px; border-radius:20px; transition:transform .2s}
  .stat b{color:var(--txt); font-variant-numeric:tabular-nums}
  @keyframes statPop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
  .stat.changed{animation:statPop .4s ease}

  .slots{display:flex; gap:10px; justify-content:center; margin:16px 0}
  .slot{
    width:56px; height:72px; border-radius:12px; border:2px dashed var(--panel-b);
    display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--muted);
    background:var(--panel); transition:transform .2s}
  .slot.filled{border-style:solid; border-color:transparent; color:#fff}
  @keyframes slotDrop{0%{transform:translateY(-18px) scale(.6); opacity:0}70%{transform:translateY(3px) scale(1.1)}100%{transform:none; opacity:1}}
  .slot.filled .in{display:inline-block; animation:slotDrop .3s ease}

  .hand{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:6px}
  .card{
    position:relative; border:1px solid var(--panel-b); border-radius:16px; padding:14px 6px 10px;
    background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    cursor:pointer; text-align:center; transition:transform .1s ease, box-shadow .2s ease, border-color .2s; overflow:hidden;
  }
  .card:hover{transform:translateY(-4px); border-color:var(--cc,var(--panel-b))}
  .card:active{transform:translateY(-1px) scale(.97)}
  .card .emoji{font-size:34px; line-height:1; position:relative; z-index:2}
  .card .emoji.sym{font-weight:900; color:var(--cc); text-shadow:0 2px 10px rgba(0,0,0,.4)}
  .card .name{font-size:11.5px; font-weight:700; margin-top:6px; letter-spacing:.02em; position:relative; z-index:2}
  .card .glow{position:absolute; left:50%; bottom:-30%; width:120%; height:70%; transform:translateX(-50%);
    border-radius:50%; opacity:.55; filter:blur(14px); background:var(--cc,#888)}
  .card.disabled{opacity:.4; pointer-events:none}
  @keyframes cardZap{0%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}100%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
  .card.zap{animation:cardZap .4s ease-out}

  .actions{display:flex; gap:10px; margin-top:14px}
  .btn{
    flex:1; padding:13px; border-radius:14px; border:none; cursor:pointer; font-weight:800; font-size:15px;
    background:var(--gold); color:#231a02;
  }
  .btn.ghost{background:var(--panel); color:var(--txt); border:1px solid var(--panel-b)}
  .btn:active{transform:translateY(1px)}
  .hidden{display:none !important}

  .overlay{position:fixed; inset:0; background:rgba(6,9,20,.82); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50}
  .overlay.show{display:flex; animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{width:100%; max-width:400px; background:linear-gradient(180deg,#1a2244,#10152b);
    border:1px solid var(--panel-b); border-radius:22px; padding:24px; text-align:center; position:relative; overflow:hidden}
  .modal .halo{position:absolute; top:-40px; left:50%; transform:translateX(-50%); width:220px; height:220px;
    border-radius:50%; filter:blur(46px); opacity:.5; z-index:0}
  .modal>*{position:relative; z-index:1}
  .modal .badge{font-size:78px; line-height:1; margin:4px 0 6px; filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
  @keyframes badgeIn{0%{transform:scale(0) rotate(-25deg)}70%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
  .modal .badge.anim{animation:badgeIn .55s cubic-bezier(.2,1.3,.4,1)}
  .modal h2{font-size:24px; margin-bottom:4px}
  .modal .kind{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
  .modal p{font-size:15px; line-height:1.5; color:#dbe3ff; margin-bottom:8px}
  .modal .newtag{display:inline-block; background:var(--gold); color:#231a02; font-weight:800;
    font-size:12px; padding:4px 10px; border-radius:20px; margin:6px 0 12px; letter-spacing:.05em; animation:tagPulse 1.1s ease-in-out infinite}
  @keyframes tagPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .modal .seq{font-size:22px; letter-spacing:.15em; margin:6px 0 16px}

  .gallery-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:6px 0 16px; text-align:left}
  .gcell{background:var(--panel); border:1px solid var(--panel-b); border-radius:14px; padding:12px; display:flex; gap:10px; align-items:flex-start}
  .gcell.win{border-color:rgba(246,196,83,.35)}
  .gcell .ge{font-size:32px; line-height:1}
  .gcell.locked .ge{filter:grayscale(1) opacity(.5)}
  .gcell .gt{font-size:14px; font-weight:800}
  .gcell.locked .gt{color:var(--muted)}
  .gcell .gh{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.35}
  .gcell .gseq{font-size:14px; letter-spacing:.1em; margin-top:5px; font-weight:800}
  .progress{font-size:13px; color:var(--muted); margin-bottom:10px}
  .progress b{color:var(--gold)}

  .toast{position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
    background:#232b4d; border:1px solid var(--panel-b); color:var(--txt); padding:11px 18px; border-radius:14px;
    font-weight:700; font-size:14px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:80}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- MENU -->
<div class="wrap screen active" id="s-menu">
  <div class="menu">
    <div class="brand">GÊNESIS</div>
    <div class="tagline">8 mundos para criar — e descobrir seus destinos</div>
    <div class="menu-orb">
      <div class="orbit"><span>🔥</span></div>
      <div class="core"></div>
      <div class="ico">🌌</div>
    </div>
    <div class="menu-btns">
      <button class="btn-primary" id="btnJogar">▶ Jogar</button>
      <div class="menu-row">
        <button class="btn-sec" id="btnEmblemasMenu">🏅 Emblemas</button>
        <button class="btn-sec muteBtn" id="muteMenu">🔊 Som</button>
      </div>
      <button class="btn-whats" id="btnShare">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.004 3.2c-7.06 0-12.8 5.74-12.8 12.8 0 2.257.59 4.46 1.71 6.4L3.2 28.8l6.57-1.72a12.74 12.74 0 0 0 6.234 1.62h.005c7.06 0 12.8-5.74 12.8-12.8s-5.74-12.7-12.805-12.7zm0 23.02h-.004a10.6 10.6 0 0 1-5.4-1.48l-.388-.23-4.003 1.05 1.07-3.9-.253-.4a10.56 10.56 0 0 1-1.62-5.66c0-5.86 4.77-10.62 10.63-10.62 2.84 0 5.5 1.11 7.51 3.12a10.55 10.55 0 0 1 3.11 7.51c0 5.86-4.77 10.62-10.63 10.62zm5.83-7.95c-.32-.16-1.89-.93-2.18-1.04-.29-.11-.5-.16-.72.16-.21.32-.82 1.04-1.01 1.25-.19.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.58-.95-.85-1.59-1.9-1.78-2.22-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56-.08-.16-.72-1.73-.99-2.37-.26-.62-.53-.54-.72-.55l-.61-.01c-.21 0-.56.08-.85.4-.29.32-1.11 1.09-1.11 2.66s1.14 3.08 1.3 3.29c.16.21 2.24 3.42 5.43 4.8.76.33 1.35.52 1.81.67.76.24 1.45.21 2 .13.61-.09 1.89-.77 2.16-1.52.27-.75.27-1.39.19-1.52-.08-.13-.29-.21-.61-.37z"/></svg>
        Compartilhar no WhatsApp
      </button>
    </div>
    <div class="menu-foot">v3 · feito com ♥</div>
  </div>
</div>

<!-- WORLD SELECT -->
<div class="wrap screen" id="s-worlds">
  <div class="topbar">
    <button class="backbtn" id="backToMenu">← Menu</button>
    <div class="topbtns"><button class="iconbtn muteBtn" id="muteWorlds">🔊</button></div>
  </div>
  <div class="worlds-head">
    <h2>Escolha um mundo</h2>
    <p>8 mundos, cada um com seus próprios destinos</p>
  </div>
  <div class="worlds-grid" id="worldsGrid"></div>
</div>

<!-- GAME -->
<div class="wrap screen" id="s-game">
  <div class="topbar">
    <button class="backbtn" id="backToWorlds">← Mundos</button>
    <div class="title" id="gameTitle" style="text-align:center; flex:1">—<small>Mundo</small></div>
    <div class="topbtns">
      <button class="iconbtn muteBtn" id="muteGame">🔊</button>
      <button class="medals-btn" id="openGallery">🏅 <b id="medalCount">0</b>/8</button>
    </div>
  </div>

  <div class="scene">
    <canvas id="fx"></canvas>
    <div class="lvl" id="lvlName">—</div>
    <div class="world-slot">
      <div class="ring" id="ring"></div>
      <div class="world" id="world"><div class="shine"></div><span class="emo" id="worldEmo">🌑</span></div>
    </div>
    <div class="story in" id="story">—</div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="slots" id="slots"></div>
  <div class="hand" id="hand"></div>

  <div class="actions">
    <button class="btn ghost" id="resetBtn">↺ Recomeçar</button>
  </div>
</div>

<!-- overlays -->
<div class="overlay" id="endOverlay">
  <div class="modal">
    <div class="halo" id="endHalo"></div>
    <div class="badge anim" id="endBadge">🌳</div>
    <div class="kind" id="endKind">Final desbloqueado</div>
    <h2 id="endTitle">—</h2>
    <div class="newtag hidden" id="newTag">✦ NOVO EMBLEMA ✦</div>
    <p id="endText">...</p>
    <div class="seq" id="endSeq"></div>
    <div class="actions">
      <button class="btn" id="playAgain">Jogar de novo</button>
      <button class="btn ghost" id="toGallery">🏅 Emblemas</button>
    </div>
  </div>
</div>

<div class="overlay" id="galleryOverlay">
  <div class="modal">
    <div class="kind" id="galleryTitle">Coleção de destinos</div>
    <h2 style="margin-bottom:8px">Emblemas</h2>
    <div class="progress"><b id="galleryCount">0</b> de 8 destinos descobertos</div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="actions"><button class="btn" id="closeGallery">Voltar a jogar</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = id=>document.getElementById(id);

  /* ============================================================
     MUNDO 1 — OS ELEMENTOS
  ============================================================ */
  const W1_CARDS = [
    {key:"fogo",  emoji:"🔥", name:"FOGO",  color:"#ff6a3d", color2:"#ffc24d", fx:"up"},
    {key:"agua",  emoji:"💧", name:"ÁGUA",  color:"#3d9bff", color2:"#9fe0ff", fx:"down"},
    {key:"terra", emoji:"🌍", name:"TERRA", color:"#b98d54", color2:"#e6c48a", fx:"heavy"},
    {key:"ar",    emoji:"💨", name:"AR",    color:"#c8d6f5", color2:"#ffffff", fx:"spread"},
  ];
  function w1_new(){ return {heat:0, water:0, land:0, life:0, chaos:0}; }
  function w1_apply(prev, el){
    const s={...prev};
    if(el==="fogo"){ s.heat+=2; if(prev.water>0){s.water-=2;s.chaos+=2;} if(prev.life>0){s.life-=1;s.chaos+=1;} }
    else if(el==="agua"){ s.water+=2; s.heat-=1; if(prev.heat>=2){s.chaos+=2;} if(prev.land>0&&s.life<3){s.life+=1;} }
    else if(el==="terra"){ s.land+=2; if(s.chaos>0)s.chaos-=1; if(prev.water>=2&&s.life<3){s.life+=1;} }
    else if(el==="ar"){ s.chaos+=1; if(prev.heat>=2){s.heat+=1;s.chaos+=1;} if(prev.water>=3){s.water+=1;} if(prev.life>0&&s.life<3){s.life+=1;} }
    return s;
  }
  function w1_classify(s){
    if(s.chaos>=4) return "cataclismo";
    if(s.life>=2) return "eden";
    if(s.heat<=-2) return "gelo";
    if(s.heat>=3&&s.water<=0) return "inferno";
    if(s.land>=2&&s.heat>=1&&s.water<=0&&s.life<=0) return "deserto";
    if(s.land>=3&&s.water<=0&&s.life<=0) return "pedra";
    if(s.water>=3&&s.heat<=1) return "diluvio";
    if(s.water>=2&&s.heat<=1&&s.life<=0&&s.land<=1) return "diluvio";

  const Audio = (function(){
    let ctx=null, master=null;
    let muted = localStorage.getItem("genesis_muted")==="1";
    function ensure(){ if(ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination); }
    function now(){ return ctx.currentTime; }
    function tone(freq,t0,dur,type,vol,glideTo){ if(!ctx) return;
      const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0);
      if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t0+dur);
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02); }
    function noise(t0,dur,vol,filterType,freq){ if(!ctx) return;
      const n=ctx.createBufferSource(); const buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
      const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1); n.buffer=buf;
      const f=ctx.createBiquadFilter(); f.type=filterType||"lowpass"; f.frequency.value=freq||800;
      const g=ctx.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);

      else if(fx==="down"){ tone(680,t,0.28,"sine",0.18,240); tone(520,t+0.06,0.22,"sine",0.10,200); }
      else if(fx==="heavy"){ tone(90,t,0.32,"square",0.20,60); noise(t,0.12,0.12,"lowpass",200); }
      else { noise(t,0.4,0.16,"bandpass",1400); tone(900,t,0.3,"triangle",0.06,1600); } }
    function win(){ if(muted) return; ensure(); if(!ctx) return; res();
      const t=now(); [523,659,784,1047].forEach((f,i)=>tone(f,t+i*0.09,0.5,"triangle",0.16)); [262,392].forEach(f=>tone(f,t+0.28,0.7,"sine",0.10)); }

  const FX = (function(){
    const cv=$("fx"); const g=cv.getContext("2d");
    let W=0,H=0,dpr=1, parts=[], raf=null;
    function resize(){ const r=cv.getBoundingClientRect(); if(!r.width) return;
      dpr=Math.min(2,window.devicePixelRatio||1); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0); }
    function worldCenter(){ const wr=$("world").getBoundingClientRect(), cr=cv.getBoundingClientRect();
      return {x:wr.left-cr.left+wr.width/2, y:wr.top-cr.top+wr.height/2, r:wr.width/2}; }
    function spawn(fx, big, colA, colB){
      const c=worldCenter(); const n=big?46:22;
      for(let i=0;i<n;i++){
        const ang=Math.random()*Math.PI*2, sp=(big?1.6:1)*(1+Math.random()*2.6);
        let vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp, grav=0, life=40+Math.random()*30, size=2+Math.random()*3;
        if(fx==="up"){ vy=-Math.abs(vy)-0.6; grav=-0.03; }
        else if(fx==="down"){ grav=0.10; }
        else if(fx==="heavy"){ vy=Math.abs(vy)*0.4; grav=0.14; size=2+Math.random()*4; }
        else { grav=0; life=50+Math.random()*30; }
        const col=Math.random()<0.5?colA:colB;
        parts.push({x:c.x+Math.cos(ang)*c.r*0.5, y:c.y+Math.sin(ang)*c.r*0.5, vx,vy,grav,life,max:life,size,col});
      }
      loop();
    }
    function burst(color,n){ const c=worldCenter();
      for(let i=0;i<(n||60);i++){ const ang=Math.random()*Math.PI*2, sp=1+Math.random()*4.5;
        parts.push({x:c.x,y:c.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,grav:0.03,life:50+Math.random()*40,max:90,size:2+Math.random()*3,col:color}); }
      loop(); }
    function loop(){ if(raf) return;
      const step=()=>{ g.clearRect(0,0,W,H);
        for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.vx*=0.98; p.vy=p.vy*0.98+p.grav; p.x+=p.vx; p.y+=p.vy; p.life--;

  // ---------- SOUND BUTTONS ----------
  function refreshMuteButtons(){ const m=Audio.isMuted();
    document.querySelectorAll(".muteBtn").forEach(btn=>{ btn.textContent = btn.id==="muteMenu" ? (m?"🔇 Som":"🔊 Som") : (m?"🔇":"🔊"); }); }

  // ---------- EVENTS ----------
  $("btnJogar").onclick=()=>{ Audio.ensure(); Audio.click(); showScreen("s-worlds"); renderWorlds(); };
  $("btnEmblemasMenu").onclick=()=>{ Audio.click(); openGallery(); };
  $("btnShare").onclick=()=>{ Audio.click();
    const GAME_URL="https://alvarony.github.io/jogo-genesis/";
    const msg="🌍 *GÊNESIS* — crie mundos e descubra seus destinos!\n\nCada mundo tem 8 finais secretos pra desbloquear. Será que você acha todos? 🏅\n\nJoga aí: "+GAME_URL;
    window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank","noopener");
  };
  $("backToMenu").onclick=()=>{ Audio.click(); showScreen("s-menu"); };
  $("worldsGrid").addEventListener("click", e=>{
    const t=e.target.closest(".wtile"); if(!t) return;
    const id=+t.dataset.world; const w=WORLDS.find(x=>x.id===id);
    if(w&&w.playable){ Audio.click(); enterWorld(id); }
    else { t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake"); toast("🔒 Mundo em breve!"); }
  });
  $("backToWorlds").onclick=()=>{ Audio.click(); showScreen("s-worlds"); renderWorlds(); };
  handEl.addEventListener("click", e=>{ const c=e.target.closest(".card"); if(c) playCard(c.dataset.el); });
  $("resetBtn").onclick=()=>{ Audio.click(); reset(); };
  $("openGallery").onclick=()=>{ Audio.click(); openGallery(); };
  $("playAgain").onclick=()=>{ Audio.click(); $("endOverlay").classList.remove("show"); reset(); };
  $("toGallery").onclick=()=>{ Audio.click(); $("endOverlay").classList.remove("show"); openGallery(); };
  $("closeGallery").onclick=()=>{ Audio.click(); $("galleryOverlay").classList.remove("show"); };
  document.querySelectorAll(".muteBtn").forEach(btn=>{ btn.onclick=()=>{ const m=Audio.toggle(); if(!m){ Audio.ensure(); Audio.click(); } refreshMuteButtons(); }; });

  window.__genesis = {GAMES, WORLD1, WORLD2, showScreen};
  refreshMuteButtons();
})();
</script>
</body>
</html>
